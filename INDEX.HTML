<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home Lights</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Smart Home Lights</h1>
        <p>Remote Light Control</p>

        <div class="card">
            <h2>Living Room</h2>
            <span id="livingStatus">OFF</span>
            <button id="livingBtn">Turn ON</button>
        </div>

        <div class="card">
            <h2>Bathroom</h2>
            <span id="bathroomStatus">OFF</span>
            <button id="bathroomBtn">Turn ON</button>
        </div>

        <div class="card">
            <h2>Closet</h2>
            <span id="closetStatus">OFF</span>
            <button id="closetBtn">Turn ON</button>
        </div>

        <p id="connection">Connecting...</p>
    </div>

    <script type="module" src="script.js"></script>

</body>
</html>
